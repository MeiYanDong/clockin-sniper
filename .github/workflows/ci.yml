name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, test, and package audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clockin-sniper
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clockin-sniper/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check public repository scope
        run: node ../scripts/check-public-scope.mjs

      - name: Run the complete quality gate
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log

      - name: Publish test and coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ClockIn quality evidence"
            echo
            echo '```text'
            grep -E '^(.*tests [0-9]+|.*pass [0-9]+|.*fail [0-9]+|.*all files.*|.*start of coverage report|.*end of coverage report)' verify.log || true
            echo '```'
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  pull-request-title:
    name: Conventional pull-request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate title
        shell: bash
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must follow Conventional Commits, for example: feat(entry): add wallet lanes"
            exit 1
          fi
